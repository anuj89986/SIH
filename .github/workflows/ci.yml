name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Python engine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r requirements.txt

      - name: Show the environment CI actually built
        run: python -c "import numpy,pandas,scipy,pulp,highspy,lightgbm,pvlib; print('numpy',numpy.__version__,'| pandas',pandas.__version__,'| lightgbm',lightgbm.__version__,'| pvlib',pvlib.__version__)"

      - name: Unit tests
        run: python -m pytest tests -q

      # Deliberately NOT the 210-day season: that takes ~45-60 min because every
      # control step is a real MILP solve. This is a short smoke run that proves the
      # pipeline is wired end to end. The committed ERA5 Parquet cache means it needs
      # no network. Reproduce the full season locally with `python run.py --days 210`.
      - name: Smoke run (14 days, three controllers, no scenarios)
        run: >
          python run.py --days 14 --step 6 --controllers A,B,C
          --no-scenarios --skip-forecast-eval

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-smoke-results
          path: |
            engine/results/metrics.csv
            engine/results/run.json
            engine/dashboard/dashboard.html
          if-no-files-found: warn

  web:
    name: Demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm test

      - run: npm run build
